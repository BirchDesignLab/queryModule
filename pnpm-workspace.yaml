packages:
  - "packages/*"
  - "apps/*"
engineStrict: true
allowBuilds:
  esbuild: false
# [critic:T2] better-auth declares drizzle-kit, vitest, react and react-dom as
# optional peerDependencies, and pnpm links any matching version present in the
# workspace into its snapshot. This setting stops the root project's own
# devDependencies from feeding peers. The api keeps that tooling out of its
# production graph by declaring only its esbuild externals (@libsql/client) as
# dependencies; everything build.mjs bundles is a devDependency.
# packages/api/test/prod-deps.test.ts enforces it.
resolvePeersFromWorkspaceRoot: false
overrides:
  # GHSA-w5hq-g745-h8pq: xcode@3.0.1 (newest; via expo config plugins) pins uuid ^7.
  # 11.x is patched and still ships CommonJS for xcode's require("uuid").
  "xcode>uuid": "^11.1.1"
  # GHSA-67mh-4wv8-2f99: drizzle-kit pins the deprecated @esbuild-kit/* loaders,
  # which pin esbuild@0.18.20. Force the patched esbuild used elsewhere in the repo.
  "@esbuild-kit/core-utils>esbuild": "^0.28.2"
