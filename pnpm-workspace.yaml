packages:
  - "packages/*"
  - "apps/*"
engineStrict: true
allowBuilds:
  esbuild: false
overrides:
  # GHSA-w5hq-g745-h8pq: xcode@3.0.1 (newest; via expo config plugins) pins uuid ^7.
  # 11.x is patched and still ships CommonJS for xcode's require("uuid").
  "xcode>uuid": "^11.1.1"
  # GHSA-67mh-4wv8-2f99: drizzle-kit pins the deprecated @esbuild-kit/* loaders,
  # which pin esbuild@0.18.20. Force the patched esbuild used elsewhere in the repo.
  "@esbuild-kit/core-utils>esbuild": "^0.28.2"
