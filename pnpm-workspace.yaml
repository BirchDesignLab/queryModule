packages:
  - "packages/*"
  - "apps/*"
engineStrict: true
allowBuilds:
  esbuild: false
  # msw's postinstall only runs `msw init` (copies the mock service worker script)
  # when package.json has msw.workerDirectory configured; not set anywhere in this
  # repo, so denying the build here has the same effect as allowing it, with no
  # script execution. Run `pnpm --filter <pkg> exec msw init <dir>` explicitly once
  # a task needs msw.workerDirectory.
  msw: false
overrides:
  # GHSA-w5hq-g745-h8pq: xcode@3.0.1 (newest; via expo config plugins) pins uuid ^7.
  # 11.x is patched and still ships CommonJS for xcode's require("uuid").
  "xcode>uuid": "^11.1.1"
  # GHSA-67mh-4wv8-2f99: drizzle-kit pins the deprecated @esbuild-kit/* loaders,
  # which pin esbuild@0.18.20. Force the patched esbuild used elsewhere in the repo.
  "@esbuild-kit/core-utils>esbuild": "^0.28.2"
auditConfig:
  ignoreGhsas:
    # GHSA-86w9-cpqp-85rv: node-forge <=1.4.0, no patched version (10-02-26). Only path is
    # apps/mobile > expo > @expo/cli (dev tooling; API and web do not use it). This one ID
    # only; remove with #492 once node-forge > 1.4.0 ships or Expo drops it.
    - GHSA-86w9-cpqp-85rv
