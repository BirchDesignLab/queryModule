name: ci

on:
  pull_request:
    # labeled/unlabeled re-run CI when api-breaking is added or removed (oasdiff step).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Spec 9.3 cancels per ref; deviation (developer 09-28-26): PR branches still cancel, but main
  # runs queue, because every main sha must finish ci (and publish its image) so it can be promoted.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ADR-0008: path detection. Every other job (except sensitive-review) is
  # skipped or path-scoped from this job's outputs; a push to main or a
  # failure here runs everything (fail closed).
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      web: ${{ steps.changes.outputs.web }}
      mobile: ${{ steps.changes.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Changed paths
        id: changes
        run: node scripts/ci/changed-paths.mjs >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}

      - name: Docs-only change
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "Only docs/ or Markdown changed; heavy jobs skipped."

  # ADR-0008: lint, typecheck, licence, dependency and workflow-tooling checks.
  # Everything else needs this job.
  checks:
    name: checks
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Step 0b: dependency-free allowlist guard on the lockfile (critic:I3,
      # PR #83 review I1). It runs with the runner's own node before
      # pnpm/action-setup and Install, so a [deps] PR cannot repoint tsx, yaml
      # or esbuild at a tarball and have that code run the parsed check below.
      # Every resolution line must be exactly `resolution: {integrity: <hash>}`;
      # quoted, spaced, tagged or multi-line forms fail (lockfile-guard.test.ts).
      - name: Lockfile registry-only (pre-install guard)
        run: node scripts/ci/lockfile-guard.mjs pnpm-lock.yaml

      # Step 1: install
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      # Step 2: biome, tsc -b
      - name: Biome
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: audit_event migrations are additive-only
        run: node scripts/ci/check-audit-migrations.ts packages/api/drizzle
      - name: No schema-table writes in the api source
        run: node scripts/ci/check-schema-writes.ts packages/api/src

      # Step 3: config:validate
      - name: Config validate
        run: pnpm config:validate

      # Step 4: licence check (BR-006)
      - name: Licence check
        run: |
          pnpm licenses list --prod --json > licences.json
          pnpm tsx scripts/ci/check-licences.ts licences.json

      # Step 4b: dependency and workflow checks (ADR-0007: they stand in for a
      # review on [deps]-tier changes such as Dependabot bumps)
      - name: Audit runtime dependencies
        run: pnpm audit --prod
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
      - name: Lockfile resolves from the registry only
        # A [deps] lockfile change must not repoint a package at a tarball URL, git
        # repo or directory; registry entries carry only an integrity hash.
        run: pnpm tsx scripts/ci/check-lockfile.ts
      # The tools that decide [deps] PRs are pinned by image digest and wheel hash
      # (actionlint 1.7.12, zizmor 1.30.1).
      - name: Workflow lint (actionlint)
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: Workflow security (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zizmor"
          {
            printf 'zizmor==1.30.1'
            printf ' --hash=sha256:%s' \
              eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e \
              4a5ef2fa4fbd2984f794cfc2f95790bd03fa0bae801487ed550e044675874e60 \
              92906f448365672ebb657fb50d36f997290a3aaba8cac723214741ea9054845d
            printf '\n'
          } > "$RUNNER_TEMP/zizmor-req.txt"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --no-deps --require-hashes -r "$RUNNER_TEMP/zizmor-req.txt"
          "$RUNNER_TEMP/zizmor/bin/zizmor" --config .github/zizmor.yml --min-severity medium .github/workflows

  # ADR-0008: the coverage suite and contract checks.
  test:
    name: test
    needs: [changes, checks]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      # Step 5: tests with coverage thresholds
      - name: Vitest
        run: pnpm coverage

      # Step 6: story-tag gate
      - name: Story tags
        run: pnpm tsx scripts/ci/check-story-tags.ts

      # Step 7: contract diff
      - name: Generated files match
        run: pnpm gen:check
      - name: oasdiff breaking
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'api-breaking')
        env:
          BASE_REF: ${{ github.base_ref }}
        # Diffs the merge base, not the base tip (#171), so a route main added after the
        # branch was cut is not a removal; a component renamed with a byte-identical body
        # (#69, #95) is mapped back first. Fails closed: skip only on the script exit code 3
        # (merge base lists no openapi.json), exit 0 must leave the file; any git failure fails the step (fetch-depth 0 above). Image pinned
        # by digest (v1.32.1).
        run: |
          set -euo pipefail
          rm -f base-openapi.json
          rc=0
          pnpm tsx scripts/ci/openapi-base.ts "origin/$BASE_REF" base-openapi.json || rc=$?
          case "$rc" in
            3) exit 0 ;;
            0) [ -f base-openapi.json ] || exit 1 ;;
            *) exit "$rc" ;;
          esac
          pnpm tsx scripts/ci/openapi-rename-map.ts base-openapi.json packages/api/openapi.json head-openapi.renamed.json
          docker run --rm -v "$PWD:/work" tufin/oasdiff@sha256:3b14fe0112e5d1bf862f91ab234a4bcd161a3f399e98f8b0b665ce70857694ac breaking /work/base-openapi.json /work/head-openapi.renamed.json --fail-on ERR

  # ADR-0008: path-scoped, skipped only when changes says web=false (fails open, #96 G-M2).
  web:
    name: web
    needs: [changes, checks]
    if: needs.changes.outputs.web != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      # Step 8: web production build
      - name: Web build
        run: pnpm --filter @querymodule/web build

  # ADR-0008: path-scoped, skipped only when changes says mobile=false (fails open, #96 G-M2).
  mobile:
    name: mobile
    needs: [changes, checks]
    if: needs.changes.outputs.mobile != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      # Step 9: mobile typecheck (apps/mobile is outside the root tsc -b) and
      # expo export, bundles only (spec 9.3, 10.7)
      - name: Mobile typecheck
        run: pnpm --filter @querymodule/mobile typecheck
      - name: Expo export
        run: pnpm --filter @querymodule/mobile export

  # Task 29 (BR-006, SEC-006, NFR-003): builds the runtime image, boots it on
  # a fresh throwaway volume, runs boot-smoke's ops checks, then a smoke
  # Playwright pass (axe, CSP) against the running container. Path-scoped
  # like the other heavy jobs; the down step always runs so a failed build or
  # smoke pass still stops the container and drains the port.
  image:
    name: image
    needs: [changes, checks]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "10: set up buildx"
        uses: docker/setup-buildx-action@v4
      - name: "10: expose the GHA cache to run: steps"
        # C1 (round 1 review): a `run:` step never gets ACTIONS_RUNTIME_TOKEN or
        # the cache URL from setup-buildx alone, so --cache-from/--cache-to
        # type=gha below silently no-ops without this. This action exports
        # ACTIONS_CACHE_URL/ACTIONS_RESULTS_URL/ACTIONS_RUNTIME_TOKEN as env
        # vars for every later step in the job.
        uses: crazy-max/ghaction-github-runtime@v4
      - name: "10: docker image build"
        # A plain buildx invocation, not docker/build-push-action (zizmor
        # cache-poisoning: that action's own step is what the audit treats as
        # a runtime-artifact publish site when a job also sets up node/pnpm;
        # this build only loads a local, untagged-for-push image). The step
        # above makes the gha cache flags below real, not a silent no-op.
        run: |
          docker buildx build --load \
            --file deploy/Dockerfile \
            --tag querymodule:ci \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      - name: "11: boot smoke up (health, triggers, seed)"
        run: bash scripts/ci/boot-smoke.sh up querymodule:ci

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @querymodule/web exec playwright install --with-deps chromium

      - name: "12: Playwright M0 suite (harness, login, keyboard, themes, heartbeat; axe, CSP)"
        # SEED_PASSWORD_SECRET_FILE comes from step 11 (boot-smoke.sh up writes it to
        # $GITHUB_ENV): a throwaway secret for this run's container only. The smoke user's
        # password is derived from it as smoke.sh does (derivePassword, spec 8.5), masked
        # before it reaches the environment, never echoed and never on a process argv.
        # QM_BASE_URL comes from step 11 too: boot-smoke.sh sets it to the container's
        # PUBLIC_ORIGIN (http://localhost:3000), which sign-in and the WebSocket upgrade
        # check the browser's Origin against.
        run: |
          pw=$(node -e 'const c=require("node:crypto"),f=require("node:fs");process.stdout.write(c.createHmac("sha256",f.readFileSync(process.argv[1],"utf8").trim()).update(process.argv[2].toLowerCase()).digest("base64url"))' "$SEED_PASSWORD_SECRET_FILE" smoke@example.test)
          echo "::add-mask::$pw"
          export E2E_USER_EMAIL=smoke@example.test E2E_USER_PASSWORD="$pw"
          E2E_BASE_URL=$QM_BASE_URL pnpm --filter @querymodule/web exec playwright test

      # C2 (round 1 review): publish must ship the exact bytes steps 10-12
      # just smoke-tested, not a fresh rebuild in a different job. Save the
      # loaded image here, on push to main only, so publish can load and
      # push it without rebuilding anything.
      - name: "13: save the smoke-tested image for publish"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save querymodule:ci -o "$RUNNER_TEMP/querymodule-image.tar"
      - name: "13: upload the image artifact"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: querymodule-image
          path: ${{ runner.temp }}/querymodule-image.tar
          retention-days: 1

      - name: "11: boot smoke down (SIGTERM, clean exit, no key material in logs)"
        if: always()
        run: bash scripts/ci/boot-smoke.sh down querymodule:ci

  # ADR-0008: the one required check. Needs every job above (never
  # sensitive-review, which stays its own required check, and never publish,
  # which runs after ci) and runs regardless of their outcome. Allowlist: it
  # passes only when every needed job reports success or skipped (a
  # path-filter skip counts as passed); failure, cancelled, a missing or
  # unknown result, or no jobs at all fail it.
  ci:
    name: ci
    needs: [changes, checks, test, web, mobile, image]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate job results
        env:
          # Read through env, never interpolated into the script body, so a
          # crafted job/step name can't inject script (zizmor template-injection).
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = Object.entries(JSON.parse(process.env.NEEDS_JSON));
            const ok = new Set(["success", "skipped"]);
            const bad = needs.filter(([, job]) => !ok.has(job && job.result));
            if (needs.length === 0 || bad.length > 0) {
              const list = bad.map(([id, job]) => id + "=" + ((job && job.result) || "none"));
              console.error("Not passed: " + (list.join(", ") || "no needed jobs"));
              process.exit(1);
            }
            console.log("All needed jobs passed or were skipped.");
          '

  # Task 29 (BR-006, SEC-006, NFR-003): publishes the exact image bytes the
  # `image` job already built, boot-smoked and ran Playwright against
  # (C2, round 1 review): it loads the artifact that job uploaded and pushes
  # it, rebuilding nothing. Push to main only; a PR never has packages: write.
  publish:
    name: publish
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: querymodule-image
          path: ${{ runner.temp }}
      - name: "13: load the ci-tested image"
        run: docker load -i "$RUNNER_TEMP/querymodule-image.tar"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "13: tag and push the smoke-tested image"
        env:
          IMAGE_SHA_TAG: ghcr.io/birchdesignlab/querymodule:sha-${{ github.sha }}
          IMAGE_LATEST_TAG: ghcr.io/birchdesignlab/querymodule:latest
        run: |
          docker tag querymodule:ci "$IMAGE_SHA_TAG"
          docker tag querymodule:ci "$IMAGE_LATEST_TAG"
          docker push "$IMAGE_SHA_TAG"
          docker push "$IMAGE_LATEST_TAG"

  sensitive-review:
    name: sensitive-review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sensitive review artifact
        run: pnpm tsx scripts/ci/check-sensitive-review.ts
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
