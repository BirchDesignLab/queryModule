name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Changed paths
        id: changes
        run: node scripts/ci/changed-paths.mjs >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}

      - name: Docs-only change
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "Only docs/ or Markdown changed; heavy steps skipped."

      # Step 1: install
      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.docs_only != 'true'
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.docs_only != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile

      # Step 2: biome, tsc -b
      - name: Biome
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm lint
      - name: Typecheck
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm typecheck

      # Step 3: config:validate
      - name: Config validate
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm config:validate

      # Step 4: licence check (BR-006)
      - name: Licence check
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          pnpm licenses list --prod --json > licences.json
          pnpm tsx scripts/ci/check-licences.ts licences.json

      # Step 5: tests with coverage thresholds
      - name: Vitest
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm coverage

      # Step 6: story-tag gate
      - name: Story tags
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm tsx scripts/ci/check-story-tags.ts

      # Step 7: contract diff
      - name: Generated files match
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm gen:check
      - name: oasdiff breaking
        if: steps.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'api-breaking')
        run: |
          if git cat-file -e "origin/${{ github.base_ref }}:packages/api/openapi.json" 2>/dev/null; then
            git show "origin/${{ github.base_ref }}:packages/api/openapi.json" > base-openapi.json
            docker run --rm -v "$PWD:/work" tufin/oasdiff breaking /work/base-openapi.json /work/packages/api/openapi.json --fail-on ERR
          else
            echo "No openapi.json on the base branch yet; nothing to diff."
          fi

      # Step 8: web production build (added by Task 26)

  sensitive-review:
    name: sensitive-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sensitive review artifact
        run: pnpm tsx scripts/ci/check-sensitive-review.ts
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
