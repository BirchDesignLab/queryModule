name: ci

on:
  pull_request:
    # labeled/unlabeled re-run CI when api-breaking is added or removed (oasdiff step).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Spec 9.3: concurrency is cancelled per ref (PR branches and main alike).
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ADR-0008: path detection. Every other job (except sensitive-review) is
  # skipped or path-scoped from this job's outputs; a push to main or a
  # failure here runs everything (fail closed).
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      web: ${{ steps.changes.outputs.web }}
      mobile: ${{ steps.changes.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Changed paths
        id: changes
        run: node scripts/ci/changed-paths.mjs >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}

      - name: Docs-only change
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "Only docs/ or Markdown changed; heavy jobs skipped."

  # ADR-0008: lint, typecheck, licence, dependency and workflow-tooling checks.
  # Everything else needs this job.
  checks:
    name: checks
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Step 0b: dependency-free allowlist guard on the lockfile (critic:I3,
      # PR #83 review I1). It runs with the runner's own node before
      # pnpm/action-setup and Install, so a [deps] PR cannot repoint tsx, yaml
      # or esbuild at a tarball and have that code run the parsed check below.
      # Every resolution line must be exactly `resolution: {integrity: <hash>}`;
      # quoted, spaced, tagged or multi-line forms fail (lockfile-guard.test.ts).
      - name: Lockfile registry-only (pre-install guard)
        run: node scripts/ci/lockfile-guard.mjs pnpm-lock.yaml

      # Step 1: install
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      # Step 2: biome, tsc -b
      - name: Biome
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

      # Step 3: config:validate
      - name: Config validate
        run: pnpm config:validate

      # Step 4: licence check (BR-006)
      - name: Licence check
        run: |
          pnpm licenses list --prod --json > licences.json
          pnpm tsx scripts/ci/check-licences.ts licences.json

      # Step 4b: dependency and workflow checks (ADR-0007: they stand in for a
      # review on [deps]-tier changes such as Dependabot bumps)
      - name: Audit runtime dependencies
        run: pnpm audit --prod
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
      - name: Lockfile resolves from the registry only
        # A [deps] lockfile change must not repoint a package at a tarball URL, git
        # repo or directory; registry entries carry only an integrity hash.
        run: pnpm tsx scripts/ci/check-lockfile.ts
      # The tools that decide [deps] PRs are pinned by image digest and wheel hash
      # (actionlint 1.7.12, zizmor 1.30.1).
      - name: Workflow lint (actionlint)
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: Workflow security (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zizmor"
          {
            printf 'zizmor==1.30.1'
            printf ' --hash=sha256:%s' \
              eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e \
              4a5ef2fa4fbd2984f794cfc2f95790bd03fa0bae801487ed550e044675874e60 \
              92906f448365672ebb657fb50d36f997290a3aaba8cac723214741ea9054845d
            printf '\n'
          } > "$RUNNER_TEMP/zizmor-req.txt"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --no-deps --require-hashes -r "$RUNNER_TEMP/zizmor-req.txt"
          "$RUNNER_TEMP/zizmor/bin/zizmor" --config .github/zizmor.yml --min-severity medium .github/workflows

  # ADR-0008: the coverage suite and contract checks.
  test:
    name: test
    needs: [changes, checks]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      # Step 5: tests with coverage thresholds
      - name: Vitest
        run: pnpm coverage

      # Step 6: story-tag gate
      - name: Story tags
        run: pnpm tsx scripts/ci/check-story-tags.ts

      # Step 7: contract diff
      - name: Generated files match
        run: pnpm gen:check
      - name: oasdiff breaking
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'api-breaking')
        env:
          BASE_REF: ${{ github.base_ref }}
        # Fails closed: skip only when ls-tree of the base succeeds and lists no
        # openapi.json; any git failure fails the step. Image pinned by digest (v1.32.1).
        run: |
          set -euo pipefail
          listed="$(git ls-tree --name-only "origin/$BASE_REF" -- packages/api/openapi.json)"
          if [ -z "$listed" ]; then
            echo "No openapi.json on the base branch yet; nothing to diff."
            exit 0
          fi
          git show "origin/$BASE_REF:packages/api/openapi.json" > base-openapi.json
          docker run --rm -v "$PWD:/work" tufin/oasdiff@sha256:3b14fe0112e5d1bf862f91ab234a4bcd161a3f399e98f8b0b665ce70857694ac breaking /work/base-openapi.json /work/packages/api/openapi.json --fail-on ERR

  # ADR-0008: path-scoped, runs only when apps/web (or a shared root file) changed.
  web:
    name: web
    needs: [changes, checks]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      # Step 8: web production build
      - name: Web build
        run: pnpm --filter @querymodule/web build

  # ADR-0008: path-scoped, runs only when apps/mobile (or a shared root file) changed.
  mobile:
    name: mobile
    needs: [changes, checks]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      # Step 9: mobile typecheck (apps/mobile is outside the root tsc -b) and
      # expo export, bundles only (spec 9.3, 10.7)
      - name: Mobile typecheck
        run: pnpm --filter @querymodule/mobile typecheck
      - name: Expo export
        run: pnpm --filter @querymodule/mobile export

  # ADR-0008: the one required check. Needs every job above (never
  # sensitive-review, which stays its own required check) and runs regardless
  # of their outcome. Allowlist: it passes only when every needed job reports
  # success or skipped (a path-filter skip counts as passed); failure,
  # cancelled, a missing or unknown result, or no jobs at all fail it.
  ci:
    name: ci
    needs: [changes, checks, test, web, mobile]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate job results
        env:
          # Read through env, never interpolated into the script body, so a
          # crafted job/step name can't inject script (zizmor template-injection).
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = Object.entries(JSON.parse(process.env.NEEDS_JSON));
            const ok = new Set(["success", "skipped"]);
            const bad = needs.filter(([, job]) => !ok.has(job && job.result));
            if (needs.length === 0 || bad.length > 0) {
              const list = bad.map(([id, job]) => id + "=" + ((job && job.result) || "none"));
              console.error("Not passed: " + (list.join(", ") || "no needed jobs"));
              process.exit(1);
            }
            console.log("All needed jobs passed or were skipped.");
          '

  sensitive-review:
    name: sensitive-review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sensitive review artifact
        run: pnpm tsx scripts/ci/check-sensitive-review.ts
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
