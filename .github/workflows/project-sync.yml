name: project-sync

# Keeps the "Query Module 2.0" board (BirchDesignLab, project 1) in step with
# branches, PRs and issues. See docs/project-board.md "Automation".
#
# The board job reconciles every item of this repository from current truth
# (issue state, this repository's open PRs, the wave branch) on every run,
# whatever the event. GitHub keeps one pending run per concurrency group and
# drops the others in a burst, so any run that survives heals the whole board.
#
# Security: PROJECT_TOKEN (a BirchDesignLab classic token with only the
# `project` scope) is used only in the board job, which checks out nothing and
# runs no repository code. Fork PRs get no secrets, so the job skips. Anyone
# with push access can read the token by editing this file on a branch; that is
# accepted (repository writers are trusted; the token is project-only and
# expires), see docs/project-board.md. The sensitive-label job runs PR code but
# holds only GITHUB_TOKEN, for same-repository PRs.

on:
  push:
    branches: ["feat/p0-wave-*"]
  pull_request:
    # edited: a "Closes #n" line added to the PR body later.
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize, closed, edited]
  issues:
    types: [closed, reopened]
  # Run once by hand after gh-setup-project.mjs --apply creates the Level field
  # (its writes trigger no event), so the roll-up and wave-parent close catch up.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  board:
    name: board
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'synchronize'
    permissions:
      issues: write
      pull-requests: read
    concurrency:
      group: project-sync-board
      cancel-in-progress: false
    steps:
      - name: Reconcile project fields
        uses: actions/github-script@v9
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          script: |
            const OWNER = "BirchDesignLab";
            const NUMBER = 1;
            const REPO = `${context.repo.owner}/${context.repo.repo}`;
            if (!process.env.PROJECT_TOKEN) {
              core.notice("PROJECT_TOKEN is not set (or this is a fork PR); board sync skipped.");
              return;
            }
            const pm = getOctokit(process.env.PROJECT_TOKEN);

            const { user } = await pm.graphql(
              `query($o:String!,$n:Int!){user(login:$o){projectV2(number:$n){id
                fields(first:50){nodes{... on ProjectV2FieldCommon{id name}
                ... on ProjectV2SingleSelectField{options{id name}}}}}}}`,
              { o: OWNER, n: NUMBER },
            );
            const project = user.projectV2;
            const field = (name) => project.fields.nodes.find((f) => f.name === name);
            // Parent identity (wave-parent close, date roll-up) comes from the
            // Level field. Until gh-setup-project.mjs --apply creates it, every
            // item would look like a leaf, so both wait (PR #83 review M1).
            const hasLevel = Boolean(field("Level"));
            if (!hasLevel)
              core.notice("Level field missing; roll-up and wave-parent close wait for gh-setup-project --apply");

            // Items of this repository only, keyed by issue number.
            const items = new Map();
            for (let after = null; ; ) {
              const { node } = await pm.graphql(
                `query($p:ID!,$a:String){node(id:$p){... on ProjectV2{items(first:100,after:$a){
                  pageInfo{hasNextPage endCursor}
                  nodes{id content{... on Issue{number title state stateReason
                    createdAt closedAt
                    repository{nameWithOwner} parent{number title}
                    subIssuesSummary{total completed}
                    closedByPullRequestsReferences(first:20,includeClosedPrs:false){nodes{state isDraft
                      headRepository{nameWithOwner}}}}}
                  fieldValues(first:30){nodes{
                    ... on ProjectV2ItemFieldSingleSelectValue{name field{... on ProjectV2FieldCommon{name}}}
                    ... on ProjectV2ItemFieldDateValue{date field{... on ProjectV2FieldCommon{name}}}}}}}}}}`,
                { p: project.id, a: after },
              );
              for (const it of node.items.nodes) {
                const c = it.content;
                if (!c?.number || c.repository?.nameWithOwner !== REPO) continue;
                const values = {};
                for (const v of it.fieldValues.nodes) if (v.field?.name) values[v.field.name] = v.name ?? v.date;
                items.set(c.number, { id: it.id, ...c, values });
              }
              if (!node.items.pageInfo.hasNextPage) break;
              after = node.items.pageInfo.endCursor;
            }

            async function set(item, name, value) {
              if (item.values[name] === value) return;
              const f = field(name);
              if (!f) throw new Error(`project has no field ${name}`);
              if (value === null) {
                await pm.graphql(
                  `mutation($p:ID!,$i:ID!,$f:ID!){clearProjectV2ItemFieldValue(
                    input:{projectId:$p,itemId:$i,fieldId:$f}){projectV2Item{id}}}`,
                  { p: project.id, i: item.id, f: f.id },
                );
              } else {
                let v;
                if (f.options) {
                  const opt = f.options.find((o) => o.name === value);
                  if (!opt) throw new Error(`field ${name} has no option ${value}`);
                  v = { singleSelectOptionId: opt.id };
                } else v = { date: value };
                await pm.graphql(
                  `mutation($p:ID!,$i:ID!,$f:ID!,$v:ProjectV2FieldValue!){updateProjectV2ItemFieldValue(
                    input:{projectId:$p,itemId:$i,fieldId:$f,value:$v}){projectV2Item{id}}}`,
                  { p: project.id, i: item.id, f: f.id, v },
                );
              }
              item.values[name] = value;
              core.info(`#${item.number} ${name} = ${value}`);
            }

            // Wave state from the branch and its open PR.
            const waveCache = new Map();
            async function waveStatus(k) {
              if (waveCache.has(k)) return waveCache.get(k);
              const { repository } = await github.graphql(
                `query($o:String!,$r:String!,$b:String!,$q:String!){repository(owner:$o,name:$r){
                  ref(qualifiedName:$q){name}
                  pullRequests(headRefName:$b,states:OPEN,first:20){nodes{isDraft headRepository{nameWithOwner}}}}}`,
                { o: context.repo.owner, r: context.repo.repo, b: `feat/p0-wave-${k}`, q: `refs/heads/feat/p0-wave-${k}` },
              );
              // A fork PR from a branch of the same name does not count.
              const pr = repository.pullRequests.nodes.find((p) => p.headRepository?.nameWithOwner === REPO);
              const s = pr ? (pr.isDraft ? "In Progress" : "In Review") : repository.ref ? "In Progress" : null;
              waveCache.set(k, s);
              return s;
            }
            // Wave identity comes from the Wave field (developer decision, #80),
            // never a title regex: a renamed wave parent (old or new title style)
            // still maps to its branch, and a task inherits its wave parent's Wave
            // field through the sub-issue `parent` link when the task carries none
            // of its own.
            const waveNumber = (v) => /^W(\d+)$/.exec(v ?? "")?.[1];
            const waveOf = (item) => {
              const own = waveNumber(item.values.Wave);
              if (own) return own;
              const parent = item.parent ? items.get(item.parent.number) : null;
              return parent ? waveNumber(parent.values.Wave) : undefined;
            };

            // Status from truth; null means no PR or wave speaks for the item.
            async function truth(item) {
              if (item.state === "CLOSED") return item.stateReason === "COMPLETED" ? "Done" : null;
              // Only this repository's PRs: a fork PR saying "Closes #n" does not steer the board.
              const prs = item.closedByPullRequestsReferences.nodes.filter(
                (p) => p.state === "OPEN" && p.headRepository?.nameWithOwner === REPO,
              );
              if (prs.some((p) => !p.isDraft)) return "In Review";
              if (prs.length > 0) return "In Progress";
              const k = waveOf(item);
              return k ? await waveStatus(k) : null;
            }

            async function reconcile(item) {
              if (!item) return;
              // A wave parent closes when all of its tasks are closed. Identity
              // comes from the Level field (developer decision, #80), never a
              // title regex.
              const isWaveParent = hasLevel && item.values.Level === "Wave";
              const sum = item.subIssuesSummary;
              if (isWaveParent && item.state === "OPEN" && sum.total > 0 && sum.completed === sum.total) {
                await github.rest.issues.update({ ...context.repo, issue_number: item.number, state: "closed", state_reason: "completed" });
                item.state = "CLOSED";
                item.stateReason = "COMPLETED";
                core.info(`#${item.number} closed (all sub-issues closed)`);
              }
              const s = await truth(item);
              if (!s) {
                // Reopened, or its PR closed unmerged: Done and In Review no longer hold.
                if (item.state === "OPEN" && (item.values.Status === "Done" || item.values.Status === "In Review"))
                  await set(item, "Status", "Todo");
                return;
              }
              // Blocked is the developer's; only review or completion moves it.
              if (item.values.Status === "Blocked" && s === "In Progress") return;
              await set(item, "Status", s);
            }

            // Every item, on every run: a dropped run (pending runs are replaced in a
            // burst) or a closed issue that gets no later event is healed here.
            for (const item of items.values()) await reconcile(item);

            // Start/Finish roll-up (developer decision, #80 requirements 4-6).
            // The project started 2026-09-25: no date before it, clamp up to it.
            // Leaves (Task, Follow-up): Start = created date, Finish = closed
            // date only when closed as completed, both clamped. Parents (Wave,
            // Phase, Milestone), identified by the Level field, roll their dates
            // up from their children (found via each child's own `parent` link,
            // already on every item from the query above, to any depth) bottom
            // up: Start = earliest child Start; Finish = latest child Finish
            // once every child is closed, else the latest child date so far
            // (each child's Finish, or its Start when it has none). This
            // replaces the old "Start set on first In Progress/In Review,
            // Finish cleared on any open issue" rule for leaves; that rule no
            // longer applies to parents, which keep their rolled-up dates while
            // open. board-model.mjs (scripts/ops/) carries the identical rules
            // in JS for the setup-script backfill; this copy exists because the
            // board job runs no repository code (docs/project-board.md
            // "Automation"), so the YAML cannot import it.
            if (!hasLevel) return;
            const FLOOR = "2026-09-25";
            const clampToFloor = (date) => {
              const d = date.slice(0, 10);
              return d < FLOOR ? FLOOR : d;
            };
            function leafDates(item) {
              const start = clampToFloor(item.createdAt);
              const completed =
                item.state === "CLOSED" && (item.stateReason === "COMPLETED" || item.stateReason == null);
              const finish = completed && item.closedAt ? clampToFloor(item.closedAt) : null;
              return { start, finish };
            }
            function rollUp(children) {
              const dated = children.filter((c) => c.start);
              if (dated.length === 0) return { start: null, finish: null };
              const start = dated.map((c) => c.start).sort()[0];
              const allClosed = children.every((c) => c.closed);
              const finish = allClosed
                ? dated.map((c) => c.finish).filter(Boolean).sort().at(-1) ?? null
                : dated.map((c) => c.finish ?? c.start).sort().at(-1) ?? null;
              return { start, finish };
            }
            const childrenOf = new Map();
            for (const it of items.values()) {
              if (!it.parent) continue;
              const list = childrenOf.get(it.parent.number) ?? [];
              list.push(it);
              childrenOf.set(it.parent.number, list);
            }
            const dateInfo = new Map();
            function dateInfoOf(it) {
              if (dateInfo.has(it.number)) return dateInfo.get(it.number);
              const level = it.values.Level;
              let info;
              if (level === "Wave" || level === "Phase" || level === "Milestone") {
                const children = (childrenOf.get(it.number) ?? []).map(dateInfoOf);
                info = { ...rollUp(children), closed: it.state === "CLOSED" };
              } else {
                info = { ...leafDates(it), closed: it.state === "CLOSED" };
              }
              dateInfo.set(it.number, info);
              return info;
            }
            for (const item of items.values()) {
              const info = dateInfoOf(item);
              if ((item.values.Start ?? null) !== info.start) await set(item, "Start", info.start);
              if ((item.values.Finish ?? null) !== info.finish) await set(item, "Finish", info.finish);
            }

  sensitive-label:
    name: sensitive-label
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.action != 'edited' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: sensitive-label-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Label PRs that need a sensitive review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files="$(pnpm --silent tsx scripts/ci/list-sensitive.ts)"
          if [ -n "$files" ]; then
            echo "Paths that need a sensitive review:"
            echo "$files"
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label sensitive
          else
            echo "No path needs a sensitive review."
          fi
