<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Query Module 2.0</title>
  <desc id="d">A command typed in the terminal and two mock result cards, one marked critical.</desc>
  <defs>
    <radialGradient id="g" cx="78%" cy="40%" r="60%">
      <stop offset="0" stop-color="#e1ebfa"/>
      <stop offset="1" stop-color="#f7f9fb"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#dde2e8"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="18" fill="url(#g)"/>
  <rect width="1280" height="360" rx="18" fill="url(#dots)" opacity="0.55"/>

  <text x="64" y="96" font-family="'IBM Plex Sans', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0.18em" fill="#0b4a9e">COMPUTER-AIDED DISPATCH</text>
  <text x="62" y="160" font-family="'IBM Plex Sans', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#121820">Query Module <tspan fill="#0b4a9e">2.0</tspan></text>
  <text x="64" y="206" font-family="'IBM Plex Sans', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" fill="#4d5968">Type a command. Every source answers live.</text>
  <text x="64" y="236" font-family="'IBM Plex Sans', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" fill="#4d5968">Change forms, rules and cards without a release.</text>
  <g font-family="'IBM Plex Sans', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="64" y="270" width="148" height="34" rx="17" fill="none" stroke="#dde2e8"/>
    <text x="138" y="292" text-anchor="middle" fill="#121820">Keyboard-first</text>
    <rect x="224" y="270" width="160" height="34" rx="17" fill="none" stroke="#dde2e8"/>
    <text x="304" y="292" text-anchor="middle" fill="#121820">Config, not code</text>
    <rect x="396" y="270" width="176" height="34" rx="17" fill="none" stroke="#dde2e8"/>
    <text x="484" y="292" text-anchor="middle" fill="#121820">Audited end to end</text>
  </g>

  <g transform="translate(700 52)">
    <rect width="516" height="62" rx="12" fill="#10151c" stroke="#dde2e8"/>
    <circle cx="22" cy="31" r="5" fill="#ff6b6b"/><circle cx="40" cy="31" r="5" fill="#ffd24d"/><circle cx="58" cy="31" r="5" fill="#5fd39a"/>
    <text x="84" y="38" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="20" fill="#8ab4ff">›</text>
    <text x="104" y="38" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="20" fill="#e7ecf2">VEH.ZZ-0001..26</text>
    <rect x="290" y="21" width="11" height="22" fill="#8ab4ff" opacity="0.85"/>
    <text x="492" y="37" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="12" fill="#9eabbc">202 Accepted</text>
  </g>
  
  <g transform="translate(700 140)">
    <rect width="300" height="92" rx="10" fill="#ffffff" stroke="#dde2e8"/>
    <rect width="5" height="92" rx="2" fill="#a00000"/>
    <text x="20" y="28" font-family="'IBM Plex Sans', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#121820">State system</text>
    <rect x="196" y="12" width="88" height="22" rx="11" fill="#a00000"/>
    <text x="240" y="27.5" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#ffffff">CRITICAL</text>
    <text x="20" y="56" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="13" fill="#4d5968">PLATE ZZ-0001 · 2026</text>
    <text x="20" y="77" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#a00000">STOLEN</text>
  </g>
  
  <g transform="translate(916 248)">
    <rect width="300" height="92" rx="10" fill="#ffffff" stroke="#dde2e8"/>
    <rect width="5" height="92" rx="2" fill="#0b4a9e"/>
    <text x="20" y="28" font-family="'IBM Plex Sans', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#121820">National system</text>
    <rect x="210" y="12" width="74" height="22" rx="11" fill="#0b4a9e"/>
    <text x="247" y="27.5" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#ffffff">PENDING</text>
    <text x="20" y="56" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="13" fill="#4d5968">PLATE ZZ-0001 · 2026</text>
    <text x="20" y="77" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#4d5968">awaiting answer…</text>
  </g>
  <path d="M850 114 V140 M1066 114 V248" stroke="#0b4a9e" stroke-width="2" stroke-dasharray="4 5" opacity="0.6"/>
</svg>
